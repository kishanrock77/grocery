<!-- CONFIRM OVERLAY -->

<div class="confirm-overlay" *ngIf="common.showpopupforotp">

  <!-- BOX -->

  <div class="confirm-box">

    <!-- ICON -->


    <!-- TITLE -->


    <!-- MESSAGE -->

    <div class="confirm-title">
      {{ common.showpopupforotp_title }}
    </div>
    <div class="confirm-message">
      {{ common.showpopupforotp_message}}
    </div>
    <!-- ACTIONS -->

    <div class="confirm-actions">

      <button class="yes-btn" (click)="common.closeotppopup()">

        OK

      </button>



    </div>

  </div>

</div>


<div class="confirm-overlay" *ngIf="common.showConfirm">

  <!-- BOX -->

  <div class="confirm-box">

    <!-- ICON -->

    <div class="confirm-icon">
      ?
    </div>

    <!-- TITLE -->


    <!-- MESSAGE -->

    <div class="confirm-title">
      {{ common.confrimquestin }}
    </div>

    <!-- ACTIONS -->

    <div class="confirm-actions">
      <button class="yes-btn" (click)="common.confrimok()">

        Confirm

      </button>
      <button class="cancel-btn" (click)="common.confirmcalcel()">

        Cancel

      </button>



    </div>

  </div>

</div>
