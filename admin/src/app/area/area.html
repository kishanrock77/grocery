<div class="page">
    <div class="page-loader" *ngIf="loading">
        <div class="loader"></div>
    </div>
    <div class="card">
        <h2>Add Delivery Area</h2>

        <form [formGroup]="form" (ngSubmit)="submit()">

            <!-- State Fixed -->
            <div class="field">
                <label>State</label>
                <input type="text" value="Uttar Pradesh" disabled>
            </div>

            <!-- City -->
            <div class="field">
                <label>City</label>
                {{form.value.cityName}}


                <!-- <input type="text" formControlName="cityName" placeholder="Enter city" [disabled]="true"> -->
            </div>

            <!-- Area -->
            <div class="field">
                <label>Area</label>
                <input type="text" formControlName="areaName" placeholder="Enter area">
            </div>

            <button class="button" type="submit" [disabled]="loading">
                {{ loading ? 'Saving...' : 'Save' }}
            </button>

            <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

        </form>
    </div> <br/>
 <button class="refresh-btn" style="float: right;" (click)="reload();">

            <i class="bi bi-arrow-repeat"></i>


        </button>
        <br/> <br/>
    <!-- LIST -->
    <div class="list">
       
        <div class="item" *ngFor="let a of areas">
            <div>
                <strong>{{ a.cityName }}</strong>
                <p>{{ a.areaName }}</p>
            </div>
            <div class="actions">
                <button  class="button"  (click)="edit(a)">Edit</button>
                <button class="button delete" (click)="delete(a._id)">Delete</button>
            </div>
        </div>

    </div>

</div>
