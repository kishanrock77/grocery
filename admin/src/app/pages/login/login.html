<div class="login-container" style="margin-top:20%;">
  <h2 class="login-title">
    <i class="bi bi-box-arrow-in-right login-icon"></i>{{userType | titlecase}} Login
  </h2>
  <p class="login-subtitle">Welcome to <strong>{{brandname}}</strong>, please login to continue...</p>

  <!-- User Type Selection -->
  <div class="user-type-selection" *ngIf="isurlhavelogintype==false">
    <!-- Admin -->
    <button class="user-btn admin-btn" [ngClass]="{ 'active': userType === 'admin' }" (click)="selectUserType('admin')">
      <i class="bi bi-person-badge"></i>
      <span>Admin</span>
    </button>

    <!-- Delivery Boy -->
    <button class="user-btn delivery-btn" [ngClass]="{ 'active': userType === 'deliveryboy' }"
      (click)="selectUserType('deliveryboy')">
      <i class="bi bi-truck"></i>
      <span>Delivery</span>
    </button>

    <!-- Store Owner -->
    <button class="user-btn store-btn" [ngClass]="{ 'active': userType === 'store' }" (click)="selectUserType('store')">
      <i class="bi bi-shop"></i>
      <span>Store</span>
    </button>
  </div>

  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()" *ngIf="userType!=''">
    <div class="form-group">
      <label for="email">Email <span style="color: red;">*</span></label>
      <input id="email" type="email" class="form-input" formControlName="email" placeholder="Enter email">
    </div>

    <div class="form-group">
      <label for="password">Password <span style="color: red;">*</span></label>
      <input id="password" type="password" class="form-input" formControlName="password" placeholder="Enter password">
    </div>

    <!-- Signup Link for Admin -->
    <div *ngIf="userType==='admin'" class="signup-link">
      <a routerLink="/signup">Don't have an admin account? Signup</a>
    </div>

    <button type="submit" class="submit-btn">{{userType | titlecase}} Login</button>
  </form>
</div>
<small>{{urlllll}}, {{uniqueidofdevice}}</small>
