<div class="add-store-container">

  <div class="page-loader" *ngIf="isLoading">
    <div class="loader"></div>
  </div>

  <h2 class="page-title">
    <i class="bi bi-person"></i>
    {{isEdit ? 'Edit Delivery Boy' : 'Add Delivery Boy'}} 

     <button class="refresh-btn" style="float: right;" (click)="ngOnInit();">

            <i class="bi bi-arrow-repeat"></i>


        </button>
  </h2>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="form-grid">

      <!-- NAME -->
      <div class="form-group">
        <label>Name *</label>
        <input type="text" formControlName="name">
        <div class="error" *ngIf="form.controls.name.touched && form.controls.name.invalid">
          Name is required
        </div>
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email *</label>
        <input type="email" formControlName="email">
        <div class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter valid email
        </div>
      </div>

      <!-- MOBILE -->
      <div class="form-group">
        <label>Mobile *</label>
        <input type="text" formControlName="mobile">
        <div class="error" *ngIf="form.controls.mobile.touched && form.controls.mobile.invalid">
          Enter valid 10 digit mobile
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label>Password *</label>
        <input type="text" formControlName="password">
        <div class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password is required
        </div>
      </div>

      <!-- ADDRESS -->
      <div class="form-group full">
        <label>Address *</label>
        <input type="text" formControlName="address">
        <div class="error" *ngIf="form.controls.address.touched && form.controls.address.invalid">
          Address is required
        </div>
      </div>

      <!-- PARTNER TYPE -->
      <div class="form-group full">
        <label>Partner Type *</label>

        <div class="radio-box">
          <label [class.active]="form.value.onsalaryorcommission=='salary'">
            <input type="radio" value="salary" formControlName="onsalaryorcommission">
            Salary
          </label>

          <label [class.active]="form.value.onsalaryorcommission=='commission'">
            <input type="radio" value="commission" formControlName="onsalaryorcommission">
            Commission
          </label>
        </div>
      </div>

      <!-- ✅ SHOW ONLY IF COMMISSION -->
      <ng-container *ngIf="form.value.onsalaryorcommission === 'commission'">

        <!-- COMMISSION TYPE -->
        <div class="form-group full">
          <label>Commission Type *</label>

          <div class="radio-box">
            <label [class.active]="form.value.comissionType=='percent'">
              <input type="radio" value="percent" formControlName="comissionType">
              Percentage
            </label>

            <label [class.active]="form.value.comissionType=='fixed'">
              <input type="radio" value="fixed" formControlName="comissionType">
              Fixed
            </label>
          </div>

          <div class="error" *ngIf="form.controls.comissionType.touched && form.controls.comissionType.invalid">
            Select commission type
          </div>
        </div>

        <!-- COMMISSION -->
        <div class="form-group">
          <label>Commission *</label>
          <input type="number" formControlName="commission">

          <div class="error" *ngIf="form.controls.commission.touched && form.controls.commission.invalid">
            Commission is required
          </div>
        </div>

      </ng-container>



      <!-- pickupAreas AREAS -->
      <div class="form-group full">
        <label>Pickup Areas *</label>

        <div class="checkbox-box">
          <label *ngFor="let area of deliveryPickupAreas" [class.active]="form.value.pickupAreas?.includes(area._id)">

            <input type="checkbox" [value]="area._id" [checked]="form.value.pickupAreas?.includes(area._id)"
              (change)="toggleAreapickup($event)">

            {{area.cityName}} - {{area.areaName}}

          </label>
        </div>

        <div class="error" *ngIf="form.controls.pickupAreas.touched && form.controls.pickupAreas.invalid">
          Select at least one area
        </div>
      </div>
      <!-- DELIVERY AREAS -->
      <div class="form-group full">
        <label>Delivery Areas *</label>

        <div class="checkbox-box">
          <label *ngFor="let area of deliveryPickupAreas" [class.active]="form.value.deliveryAreas?.includes(area._id)">

            <input type="checkbox" [value]="area._id" [checked]="form.value.deliveryAreas?.includes(area._id)"
              (change)="toggleArea($event)">

            {{area.cityName}} - {{area.areaName}}

          </label>
        </div>

        <div class="error" *ngIf="form.controls.deliveryAreas.touched && form.controls.deliveryAreas.invalid">
          Select at least one area
        </div>
      </div>

      <!-- IMAGE -->
      <div class="form-group full">
        <label>Profile Pic *</label>

        <input type="file" (change)="onFileSelect($event)">

        <div class="image-preview" *ngIf="preview">
          <img [src]="preview">
        </div>

        <div class="error" *ngIf="!preview && submitted">
          Profile pic is required
        </div>
      </div>

    </div>

    <button class="submit-btn">
      {{isEdit ? 'Update' : 'Create'}}
    </button>
    <button class="cancel-btn" type="button" routerLink="/deliveryboylist">
      Cancel
    </button>
  </form>

</div>
